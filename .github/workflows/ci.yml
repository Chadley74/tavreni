name: Tavreni CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:3000

  container-build:
    name: Backend Container Build
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build backend Docker image
        run: docker build -t tavreni-api:ci ./backend

      - name: Verify SQLite loads in container
        run: |
          docker run --rm \
          --entrypoint node \
          tavreni-api:ci \
          -e "require('sqlite3'); console.log('SQLite loaded successfully')"